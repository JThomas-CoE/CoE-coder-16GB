              patch. Once you begin the <patch> block, finish it.
            - Do NOT add meta-commentary such as "Wait,", "I'm not sure", "Let me
              reconsider", "Actually,", or "Hmm," more than ONCE in total. If you
              find yourself starting a sentence with "Wait, I" a second time, you are
              dithering -- STOP and write the patch immediately.
