          loop_guard_min: 1400
          loop_guard_skip: 1400
          loop_guard_match: 100
          loop_guard_window: 1000
          # 2026-09-10 (user ruling): modify-only output cap guard.  A change
          # order that runs past the artifact size is wrong by construction
          # (single-domain single-task change orders are smaller than their
          # target).  On trip: close the stream, extract the LAST COMPLETE
          # change order, validate against the round2 contract.  Passes ->
          # accept; fails -> one dedicated re-roll (fresh seed) that does NOT
          # consume the shared pathology budget.  Cloud/T3 exempt (it has
          # shortstop).
          output_cap_factor: 1.0
          output_cap_min_chars: 4000
          output_cap_max_re_rolls: 1
          # 2026-09-11 (user-ruled): invented-section replacement guard.
          # Replaces the legacy warn-only invented_section_signal when BOTH
          # conditions trip for a replacement: token overlap with the
          # original below min_token_overlap AND new_text size ratio below
          # min_size_ratio (overlap does the semantic work: condensations
          # keep vocabulary and pass; content-blind stubs fail both).
          # Replacements-only by construction: removals have no new_text,
          # insertions have no original section (no baseline). Cloud (T3)
          # gets half thresholds: it fires after locals failed and is the
          # ladder's safety net — a false rejection there costs the whole
          # modify. Values are config-owned; revisit as evidence accrues.
          # 2026-09-11 (user-ruled): self-review gate. After the change
          # order passes all contract gates, ONE same-model non-streaming
          # review call reuses the KV-warm generator prompt (persona +
          # full artifact + outline + request) and asks whether any
          # elements/sections/code depend on the changes or are left
          # unresolved (declared-but-unused, used-but-undeclared,
          # styles-for-elements-never-rendered, renamed/removed symbols
          # still called). YES -> integration; NO -> tier fails with the
          # reviewer reason (retry/ladder as usual). Reviewer call failure
          # never blocks a contract-valid package.
          self_review:
            enabled: true
            reviewer: same_model
            verdict_num_predict: 2048
            max_review_calls_per_tier: 1
            # 2026-09-12 (user-ruled wording): the review is deliberately
            # failure-safe and strict — the T3 cloud fall-through is the
            # design answer to a false rejection, so a marginal local
            # package should escalate rather than ship. Both arms of the
            # question are stated explicitly (correctness AND completeness)
            # and "when applied" redirects judgement to the resulting
            # artifact rather than the change order's surface syntax.
            # NOTE: plain prose only — no markdown/emphasis characters.
            system_suffix: "You are reviewing a proposed change order for the artifact provided above. Review question: will the change order, when applied to the artifact above, address the user's request? If the change order when applied would address the user's request both completely and correctly then the answer to the review question is YES, if not then the answer must be NO. Give the verdict and a one-sentence reason."
            # 2026-09-12 (user-approved): schema-only verdict. Ollama's
            # native structured output constrains the reply to this JSON
            # schema, so the verdict is read as a STRUCTURAL field instead
            # of being string-matched out of prose. Verified working on
            # both local reviewer models (web-r25 and gemma4-web-hc) with
            # done_reason=stop and a clean parse. There is deliberately NO
            # silent fallback to text parsing: if the reply is not valid
            # JSON the package FAILS the review (failure-safe), and a
            # backend that cannot honour `format` raises a transport error
            # rather than quietly degrading. Property order mirrors the
            # emission order actually observed (reason first); property
            # order in the schema does not control generation order.
            # NOTE: the enum values MUST be quoted — YAML 1.1 resolves a
            # bare YES/NO to the BOOLEANS true/false, which would send an
            # enum of booleans to Ollama and never match the model's
            # string "YES"/"NO" verdict.
            format_schema:
              type: object
              properties:
                reason:
                  type: string
                verdict:
                  type: string
                  enum: ["YES", "NO"]
              required: [reason, verdict]
            # 2026-09-12 (user-approved): a reviewer must not sample. The
            # reviewer call previously passed NO options at all, so it ran
            # at Ollama's defaults (temperature 0.8 / top_k 40) and
            # sometimes returned a bare "NO" with no reasoning. Greedy +
            # fixed seed makes the verdict deterministic. Keys are merged
            # through a whitelist in the transport (sampling cannot smuggle
            # num_ctx/num_predict past the bounded-context chokepoint).
            sampling:
              temperature: 0.0
              top_k: 1
              seed: 42
          invented_replacement_guard:
            enabled: true
            local:
              min_size_ratio: 0.40
              min_token_overlap: 0.20
            cloud:
              min_size_ratio: 0.20
              min_token_overlap: 0.10
            # 2026-09-11 (user ruling): BOTH semantic conflicts are
            # rejection categories. A removed/renamed symbol still
            # referenced elsewhere is almost always breaking.
            semantic_conflict_guard:
              enabled: true
          # 2026-09-12 (user-ruled): `backend_server_error` added.  The
          # runtime's D5 remap renames a deterministic llama-server 500
          # (peg-native format etc.) from `backend_error` to
          # `backend_server_error`, but that new name was classified
          # NOWHERE -- so every backend crash fell to the "unrecognized"
          # branch (no retry, budget consumed) while the MODEL-BLACKLIST
          # skipped the whole slot.  A backend error is a pathology: a
          # single 500 can be a transient transport/daemon fault, so the
          # correct response is the existing retry/reroll/escalation budget
          # plus a loud announcement -- NOT blacklisting a model or a slot
          # on one occurrence.
          pathology:
            max_re_rolls_per_model: 2
            re_roll_seed_strategy: random_per_model
            errors: [dither, loop, first_token_timeout, slow_decode_timeout, vram_breach, token_exhaustion, backend_error, backend_server_error, empty_response]
          stream_primitives:
            fence_counter:
              check_cadence_chunks: 25
              tail_after_close_without_reopen_chunks: 200
              contract_on_truncate: modify_artifact_round1
              fence_languages: [json]
            dither_check:
              check_cadence_chunks: 25
            loop_check:
              check_cadence_chunks: 25
          timers:
            first_token_timeout_s: 60.0
            slow_decode_timeout_s: 90.0
            cold_load_first_token_timeout_s: 75.0
            pathology_safety_factor: 2.5
          re_roll_modifiers:
            dither: "Your previous pass contained excess dithering. On this attempt: be concise, make the judgment call on the sections, and stop."
            loop: "Your previous pass contained a repetition loop. On this attempt: be concise and do not repeat the same section names. Produce the JSON and stop."
            output_cap: "Your previous pass grew far beyond the size of the target artifact without producing a complete change order. On this attempt: commit to the minimal change order immediately, emit the complete JSON object, and stop as soon as it is closed."
          max_calls_per_instance: 12
        parameter_ranges:
          sampling.temperature: [0.0, 2.0]
          sampling.num_predict: [512, 32768]
          pathology.max_re_rolls_per_model: [0, 10]
          dither_limit: [1, 100]
          loop_guard_min: [100, 5000]
          loop_guard_skip: [100, 5000]
          loop_guard_match: [10, 500]
          loop_guard_window: [50, 2000]
          output_cap_factor: [0.5, 5.0]
          output_cap_min_chars: [500, 100000]
          output_cap_max_re_rolls: [0, 3]
          max_calls_per_instance: [1, 50]
          timers.first_token_timeout_s: [10.0, 300.0]
          timers.slow_decode_timeout_s: [10.0, 600.0]
          timers.cold_load_first_token_timeout_s: [10.0, 600.0]

      # Opt-in A/B harness region -- `modify_artifact_focused` RETIRED (M3).
      #
      # It was an `extends: modify_artifact` variant (focused_sections context)
      # with no domain row referencing it.  Retiring it alongside the rename is
      # deliberate: `extends` resolves the parent BY NAME at load time, so
      # leaving it would have left it pointing at a key that no longer exists.
      #
      # Reversal: re-add the block with `extends: modify_harness_legacy`.

      # ================================================================
      # modify_harness -- NORMAL OPERATION (PATH A).
      # ================================================================
      # [FLAGGED FALSE as of 2026-09-20 -- superseded, retained deliberately.]
      # The lines below were TRUE when written (2026-09-16) and are FALSE now.
      # They are kept verbatim so the supersession is visible and the previous
      # claim stays auditable rather than being silently overwritten.
      #
      # SUPERSEDED TEXT (was lines 1389-1392 on 2026-09-16):
      #   # modify_harness -- NORMAL OPERATION (PATH A).  DECLARED, not yet routed.
      #   # `task_harnesses` still points at `modify_harness_legacy`, so NOTHING
      #   # routes here yet.  This block is inert until M4 re-points the row.
      #
      # ------------------------------------------------------------------
      # 2026-09-20: M4 IS NOW COMPLETE -- this harness IS the routed one.
      # ------------------------------------------------------------------
      # `task_harnesses.modify_artifact` resolves to `modify_harness` on all
      # four `domain_rows` that declare a modify harness: domain_python (:284),
      # domain_compiled (:307), domain_web (:318), domain_other (:362).
      # `modify_harness_legacy` is now OVERRIDE-ONLY, per spec 15.9 item 7: it
      # is reachable ONLY via `/task-modify-legacy` (or
      # `routing_override.legacy_route` / `metadata.legacy_route`), and the
      # selector is the block at server.py ~2858, gated on NOT direct cloud.
      #
      # WHY IT EXISTS.  PATH A is a DENOVO regeneration, but it ran on the
      # legacy harness while swapping only the CONTRACT.  The runtime block was
      # not swapped, so change-order settings leaked into a denovo path:
      #
      #   stream_primitives.fence_counter.fence_languages: [json]
      #
      # `_fence_aliases_for` returns that override UNCONDITIONALLY, so an HTML
      # (or Python, or JS, or CSS) artifact resolved to ['json'], the denovo
      # fence check could never match its own output, and every regeneration
      # failed with `no_code_fence` -- which is unclassified in the legacy
      # tiers, so it took the 'unrecognized' branch: no retry, budget consumed.
      # Observed live as:  [ladder] UNCLASSIFIED ERROR 'no_code_fence' at tier=T0
      #
      # This harness declares NO fence override, so resolution falls through
      # to FENCE_ALIASES and html -> ['html','htm'].  That is a STRUCTURAL fix,
      # not a patch: the leak is unreachable because there is no key to leak.
      #
      # [FLAGGED FALSE as of 2026-09-20 -- superseded, retained deliberately.]
      # SUPERSEDED TEXT (was line 1411 on 2026-09-16):
      #   # PATH A on this harness, and PATH B on `modify_harness_legacy`.
      #
      # 2026-09-20: PATH A runs here, and PATH B runs here TOO.  Both are the
      # LOCAL layer, and both resolve to `modify_harness`, because that is what
      # the `task_harnesses` row now names.  `modify_harness_legacy` is reached
      # only by the `-legacy` override, which is a different axis.
      # The SHARED T3 layer is still reached identically from both -- see the
      # cloud_change_order note on the legacy harness above.
      # ================================================================
      modify_harness:
        family: modify_harness
        tiers: [T0, T2]
        closed_think: true
        # Denovo output shape: a whole artifact, never a change order.
        artifact_contract: new_code_generation
        output_instruction: "Return the complete artifact in a single fenced code block. Never return a change order, a diff, a plan, or a description."
        # ----------------------------------------------------------------
        # CAPABILITY PROPERTIES -- the two-layer distinction, applied.
        # ----------------------------------------------------------------
        # local_change_order: false -- this harness's LOCAL tier is a denovo
        #     regeneration.  Its system_suffix and output_instruction below
        #     demand the COMPLETE artifact, so every local change-order gate
        #     (artifact-context injection, output-cap binding, self-review,
        #     cap rescue) is skipped by construction rather than neutralised
        #     key by key.  That is the structural answer to the leak above.
        # cloud_change_order: true -- PATH A ESCALATES into the shared T3
        #     layer when its contracts fail, and that layer returns a change
        #     order which local deterministic re-integration applies.  This is
        #     the SHARED layer, not part of the PATH A branch.
        # needs_artifact_store: true -- reads the target artifact (for the
        #     denovo contract swap and the regenerated-commit flag).
        # needs_t3_context: true -- the cloud must see the artifact + outline
        #     to emit a change order for the escalation.
        # ----------------------------------------------------------------
        local_change_order: false
        cloud_change_order: true
        needs_artifact_store: true
        needs_t3_context: true
        # Denovo classification.  These are the strings the denovo contract
        # can emit.  They are declared at TIER level because the runtime's
        # func_errs merge reads LADDER tiers only -- a harness-level
        # functional_errors key is never consulted (the 2026-09-10 no-retry
        # fix).  `no_code_fence` and `syntax_error` are the two the legacy
        # change-order tiers were missing.
        functional_errors: [empty_response, no_code_fence, syntax_error, modification_absent]
        sampling: { temperature: 0.6, top_k: -1, top_p: 1.0, repeat_penalty: 1.05, repeat_last_n: 1024, num_ctx: 32768, num_predict: 24576 }
        escalation_ladder:
          t0:
            model_slot: primary
            seed_policy: fresh
            functional_budget: 1
            user_modifier: null
            functional_errors: [empty_response, no_code_fence, syntax_error, modification_absent]
          # T1b: error-trace retry on the PRIMARY slot (seed reused, so the
          # model sees its own failed attempt).  There is deliberately NO T1a:
          # T1a is a change-order concept (targeted edit of a section), which
          # does not exist on a denovo regeneration.
          t1b:
            model_slot: primary
            seed_policy: same_as_t0
            functional_budget: 1
            user_modifier: |
              The model's generated code has the following error trace:
              {prior_error}

              Regenerate the code without the error.
            functional_errors: [empty_response, no_code_fence, syntax_error]
          t2:
            model_slot: secondary
            seed_policy: fresh
            functional_budget: 1
            user_modifier: null
            functional_errors: [empty_response, no_code_fence, syntax_error]
          # The SHARED T3 layer.  Deliberately spelled as a reference to the
          # same configuration the legacy harness uses -- ONE definition, not
          # a copy, because a duplicated cloud block is how the two harnesses
          # would drift apart.  PATH A's escalation and the legacy ladder
          # reach the SAME layer.
          meta_harness_ladder:
            targets: [cloud_sota]
            cloud:
              on_failure: hard_stop
              silence_timeout_s: 240
              total_timeout_s: 600
              reasoning_effort: "high"
              max_tokens: 50000
              tokens_per_sec: 150
              prompts:
                modify_harness:
                  system_suffix: "You are a competent artifact modification assistant. You are given the complete artifact, its tree-sitter outline, and the user's requested change. Produce a working deterministic change order that satisfies the request by identifying the exact sections by name, referenced to the treesitter outline, with the complete new contents for each modified section, the complete new text for any new sections and an existing anchor section name referenced to the treesitter outline and any sections that must be removed, again by name reference to the treesitter outline. Do not list sections that are not modified and do not regenerate the entire modified file.\nReturn ONLY a JSON object with this exact structure:\n{\"replacements\": [{\"name\": \"exact section ID\", \"new_text\": \"complete replacement text\"}], \"insertions\": [{\"name\": \"new section name\", \"anchor_section\": \"exact existing section ID\", \"position\": \"before or after\", \"new_text\": \"complete inserted text\"}], \"removals\": [{\"name\": \"exact section ID\", \"reason\": \"why removed\"}]}\n\nUse exact section IDs from the artifact outline, including synthetic `anonymous:` IDs when shown. A section must not appear in both replacements and removals. An insertion may not anchor on a removed section. ALL THREE KEYS (replacements, insertions, removals) MUST ALWAYS BE PRESENT in the JSON object -- use an empty array for any key that has no entries. Never omit a key. Do not return an analysis plan, prose, markdown fences, or reasoning outside the JSON. Be concise."
                  output_instruction: "Return only the JSON change order package with replacements, insertions, and removals. Never return the artifact or modified document itself."
              cloud_guards:
                dither_enabled: true
                shortstop_enabled: true
                # 2026-09-18: 2.0 -> 100.0 (temporary data-gathering default; see the
                # SHORTSTOP note under new_code_generation and README.md).
                shortstop_rate: 100.0
                shortstop_min_chars: 30000
                shortstop_window: 10000
                dither_limit: 10000
                dither_limit_think_scale: 3
                loop_enabled: false
                loop_guard_min: 2000
                loop_guard_skip: 2000
                loop_guard_match: 100
                loop_guard_window: 1000
        runtime:
          # NO artifact_context block: the model gets the combo prompt built
          # from the header (origin prompt + modification history + request),
          # not the full artifact body.  This is the header-only rule.
          #
          # NO stream_primitives.fence_counter override: this is the D1 fix.
          # Declaring nothing means `_fence_aliases_for` falls through to
          # FENCE_ALIASES, so the detected language (html/html, python/py,
          # javascript/js, ...) resolves correctly for a denovo artifact.
          #
          # NO output_cap_* keys: a denovo artifact is artifact-sized BY
          # CONSTRUCTION, so a cap relative to the parent is meaningless.  The
          # only bound on denovo output is sampling.num_predict (24576), the
          # system cap.
          primitives: [dither_guard, repetition_loop_guard]
          artifact_contract: new_code_generation
          retry_new_seed: true
          # ================================================================
          # PATH A REGENERATION KEYS (moved here from `modify_artifact_regenerate`).
          # ================================================================
          # These four ARE PATH A's contract and wording.  They used to live in
          # a separate `modify_artifact_regenerate` cell that server.py read by
          # NAME at request time -- so the harness that actually EXECUTED PATH A
          # carried none of its own configuration.  That indirection is what the
          # harness split exists to remove, and it is now retired.
          #
          # Behaviour is preserved exactly: `runtime = work.harness.runtime`
          # (runtime.py:3835) seeds these values directly, and the write-back in
          # execute_runtime_plan is guarded ("bound only when supplied, so the
          # harness's own values are not overwritten by an empty override").
          # The server-side copy loop that used to inject them is gone, so
          # precedence is unchanged: the harness's own values win, as intended.
          # ================================================================
          # 2026-09-17 (user ruling): `modify_regeneration_contract` was
          # RETIRED.  It named `new_code_generation` unconditionally, which is
          # how a PROSE artifact came to be validated by a CODE contract: a
          # correct two-paragraph expansion was rejected `no_code_fence`, four
          # local calls over two cold loads produced nothing, and the request
          # escalated to T3.
          #
          # The denovo contract is now selected from the ARTIFACT'S LANGUAGE
          # alone -- `runtime.denovo_contract_for_language`, reading the parent
          # through the artifact store.  There is nothing to declare here for
          # code; to retune which contract a language gets, edit that map.
          # Spec 6.1-6.4 PATH A drift checks + disclosure.  Set FALSE to disable
          # the whole set without a code change (the documented reversal).
          modify_drift_checks: true
          # The regeneration instruction.  This REPLACES the change-order
          # wording for the local tiers: the harness's own system_suffix says
          # "return ONLY a JSON object ... never return the artifact", which is
          # exactly backwards for a denovo regeneration.  `{{domain_tag}}` is
          # substituted with the domain language at runtime.
          modify_regeneration_system_suffix: |-
            You are a competent {{domain_tag}} engineer. Produce the COMPLETE, working artifact requested below -- the full file, not a description, not a plan, and not a diff. Satisfy the original build request plus every subsequent modification, and then the current request. Keep behaviour that is not being changed. Emit the artifact in a single fenced code block and nothing else.
          modify_regeneration_output_instruction: "Return the complete artifact in a single fenced code block. Never return a change order, a diff, a plan, or a description."
          # 2026-09-17: PROSE variants.  The two above demand a FENCE; for a
          # markdown/plain-text artifact that is exactly wrong -- it is what
          # invited the ```python wrapper that then failed compile() on a curly
          # apostrophe.  Selected when the artifact's language resolves to the
          # prose contract (`_regen_is_prose`).
          modify_regeneration_prose_system_suffix: |-
            You are a competent writer. Produce the COMPLETE revised document requested below -- the full text, not a description, not a plan, and not a diff. Satisfy the original request plus every subsequent modification, and then the current request. Keep wording that is not being changed. Return only the document text.
          modify_regeneration_prose_output_instruction: "Return only the complete document text. Never return a change order, a diff, a plan, or a description, and do not wrap the document in a code fence."
          loop_guard_min: 1400
          loop_guard_skip: 1400
          loop_guard_match: 100
          loop_guard_window: 1000
          pathology:
            max_re_rolls_per_model: 2
            re_roll_seed_strategy: random_per_model
            errors: [dither, loop, first_token_timeout, slow_decode_timeout, vram_breach, token_exhaustion, backend_error, backend_server_error, empty_response, output_cap_exceeded]
          timers:
            first_token_timeout_s: 60.0
            slow_decode_timeout_s: 90.0
            cold_load_first_token_timeout_s: 75.0
            pathology_safety_factor: 2.5
          re_roll_modifiers:
            dither: "Your previous pass contained excess dithering. On this attempt: be concise, commit to the artifact, and stop."
            loop: "Your previous pass contained a repetition loop. On this attempt: be concise, do not repeat yourself, and stop after the closing fence."
          max_calls_per_instance: 12
      evaluate_artifact:
        family: evaluate_artifact
        tiers: [T0, T2]
        closed_think: true
        assistant_prefill: null
        # ================================================================
        # 2026-09-16 (M2): REQUIRED for behavioural equivalence.
        # ================================================================
        # Gate 10 in runtime.py used to read:
