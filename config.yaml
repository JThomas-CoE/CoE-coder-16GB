# Clean-slice configuration. This file intentionally contains no legacy router,
# agent, ladder, registry, session, KB, or launcher configuration.
#
# 2026-09-14: origin-gated modify pipeline (see
# CoE_coder_spec_modify_pipeline_DRAFT.md).  `modify_combo_mode` selects how
# the local-regeneration prompt is assembled when an artifact carries its
# originating prompt:
#   concat     -- mechanical, reproducible concatenation (DEFAULT).
#   synthesize -- reserved; would let a model rewrite the combined prompt.
# `concat` is the default because it is the shape that was MEASURED at 75%
# reliability, it is reproducible byte-for-byte, it costs no extra call, and a
# synthesizer would reintroduce the exact reconstruction loss the capability
# study documented (a model summarising an origin and generalising its
# constants away).  This is a global policy, not a per-domain knob.
modify_combo_mode: concat

# 2026-09-19: turn progress cadence (see PLAN_progress_mechanism.md).
#
# This ONE key governs the single progress mechanism.  It drives two things that
# share the value deliberately, because they answer the same user question
# ("is this turn alive?") at the same granularity:
#
#   visibility   -- how often a client polls GET /v1/turn/{id}/progress
#   cancellation -- how often the runtime emits a `checkpoint`, which is the
#                   ONLY event that can carry a cooperative stop back to the
#                   runtime (the token emit sites DISCARD the callback's return
#                   value, so a token can never be a stop channel).
#
# CONSEQUENCE TO KNOW: cooperative cancellation of a NON-STREAMING turn takes
# effect at the next checkpoint, so its worst-case latency is this value.  A
# streaming turn cancels immediately (its asyncio task is cancelled outright).
#
# The value does NOT affect how quickly a STALLED turn becomes visible: the
# progress endpoint computes `since_last_event_s` from the turn record at
# request time, so silence is visible the moment it is polled.
#
# 30 is the default and matches the local SSE heartbeat interval.  Precedence:
#   metadata.checkpoint_interval_s  >  this key  >  code default (30.0)
# An absent/null key falls back to the code default, so deleting this line is
# always safe.
progress_interval_s: 30

# Number of finished/in-flight turn records retained for the progress endpoint
# and /v1/cancel.  Bounded by INSERTION order, not completion, so a long turn is
# never evicted merely because many short turns finished after it started.
# A client polling an evicted id gets a 404, which is the intended contract.
turn_record_keep: 64

backends:
  ollama:
    url: "http://127.0.0.1:11434/v1"
    api_key: "ollama"
    timeout: 900
    # ================================================================
    # AUTO-START LIFECYCLE (2026-09-21) -- generic, not Ollama-specific.
    # ================================================================
    # CoE-coder talks to its local inference backend over an
    # OpenAI-compatible HTTP surface, so the keys below describe ANY
    # backend (Ollama, llama.cpp's `llama-server`, LM Studio, ...):
    #
    #   auto_start          spawn it at boot when the URL is not answering.
    #   binary_name          PATH name to resolve when binary_path is null.
    #   serve_args           args after the binary (`ollama serve`).
    #   startup_timeout_s    readiness deadline after spawn.
    #   stop_on_exit         ACCEPTED AND IGNORED -- see below.
    #
    # TO SWITCH BACKENDS: point `url` at the other server and set
    # `binary_name`/`serve_args` to its launcher.  Nothing in the code
    # names Ollama; backend_lifecycle.py is provider-agnostic.
    #
    # THE INFERENCE BACKEND HAS NO FALLBACK, so an unreachable backend is
    # FATAL, not warn-and-continue: `server.py` prints a loud remedy
    # message and aborts boot rather than serving an instance whose every
    # request would fail.  (FLM, by contrast, is a *router* accelerator
    # with an Ollama fallback, so IT warns and continues.  The asymmetry
    # is deliberate -- see backend_lifecycle.py's module docstring.)
    #
    # `stop_on_exit` IS DELIBERATELY IGNORED by backend_lifecycle.py:
    # CoE-coder owns the START decision (a missing backend is a broken
    # install) but never the STOP decision.  On this reference
    # configuration `backends.cloud.url` is the SAME endpoint as this
    # one -- the local daemon proxies the cloud provider -- so the
    # daemon serves local inference AND the cloud tier.  Stopping it
    # would silently take out cloud escalation.  The key is accepted so
    # the intent is explicit rather than implicit, and set false to
    # match.  Reversal: nothing to reverse; there is no stop path.
    auto_start: true
    binary_path: null
    binary_name: "ollama"
    serve_args: ["serve"]
    startup_timeout_s: 60
    stop_on_exit: false
  flm:
    url: "http://127.0.0.1:52625/v1"
    api_key: "flm"
    timeout: 120
    # Auto-start lifecycle.  When ``auto_start`` is true the
    # runner will attempt to spawn ``flm serve
    # <router_model>`` if the configured URL is not
    # responding at boot.  The helper resolves the binary
    # from ``binary_path`` (or, if unset, from PATH via
    # ``shutil.which('flm')``), launches the child detached
    # with stdout/stderr captured to a log file under
    # ``log_dir``, and polls the URL until the server
    # answers ``/v1/models`` or ``startup_timeout_s``
    # elapses.  On any failure the runner warns and
    # continues with the Ollama router fallback.  By
    # default ``stop_on_exit`` is false — FLM has a small
    # footprint and keeping it alive avoids model-load
    # latency on the next runner invocation.
    auto_start: true
    binary_path: null
    router_model_id: "qwen3.5:4b"
    img_pre_resize: 1
    startup_timeout_s: 60
    log_dir: "clean_slice_runs"
    stop_on_exit: false
  # Optional cloud backend for the T3 zero-shot escalation of last resort.
  # When ``enabled`` is true AND ``url``/``model_id`` are set, the T3
  # fallback (after the local specialist ladder exhausts) calls this
  # OpenAI-compatible endpoint (e.g. Ollama cloud) instead of the local
  # generalist.  The local generalist (``models.general_fallback``) is
  # UNCHANGED and still serves domains with no wired specialist.  If
  # ``enabled`` is false or the endpoint is unreachable, T5 falls back
  # to the local generalist.  ``api_key`` is optional (some endpoints
  # are keyless); set it to your Ollama cloud / provider key.
  cloud:
    # Option A (zero-secret): the LOCAL daemon proxies ollama.com using
    # the ollama login stored on this machine (established via an
    # interactive `ollama run <model>:cloud`).  The CoE repo/config
    # never holds the API key -- it lives in ollama's credential store.
    # Requires ollama >= 0.32 (cloud model proxying).
    enabled: true
    url: "http://127.0.0.1:11434/v1"
    api_key: ""
    timeout: 180
    model_id: "deepseek-v4.1-flash:cloud"
    # Text-only default. Image-bearing T3 requests use vision_model_id.
    vision: false
    vision_model_id: "deepseek-v4.1-flash:cloud"

# Every named model instance declares the bounded context the clean slice
# enforces.  Without an explicit num_ctx, the VRAM manager would otherwise
# rely on Ollama's 262,144 default and overflow the compact tier budget.
models:
  router:
    provider: flm
    model_id: "qwen3.5:4b"
    vision: true
  router_fallback:
    provider: ollama
    model_id: "qwen3.5:4b"
    vision: true
    num_ctx: 16384
    keep_alive: 300
  general_fallback:
    provider: ollama
    # Default generalist (domain_other catch-all): gemma4:12b (Q4_K_M, 11.9B).
    # Vision verified: /api/show lists `vision`, and an image request at
    # num_ctx 32768 succeeded. No extra projector download is needed.
    model_id: "gemma4:12b"
    num_ctx: 32768
    num_predict: 24576
    keep_alive: 300
    vision: true

# Compact tier targets a dedicated 16 GB card used solely for inference.
# 0.2 GB is left for the OS / driver overhead; 15.8 GB is the
# admission-controlled budget.  The estimates below are conservative
# admission controls, not a replacement for the live /api/ps
# verification.
vram_tiers:
  active: compact
  # ================================================================
  # BOOT EVICTION (2026-09-21).
  # ================================================================
  # true  (default, and the behaviour before this key existed): unload EVERY
  #       resident model at startup, whoever spawned it.  Correct for a
  #       dedicated 16 GB appliance -- it guarantees the admission budget is
  #       measured on a clean card rather than on a stranger's leftover load.
  # false (opt-out, for a card with EXCESS VRAM): unload only models CoE knows
  #       about (the cfg.models + clean_resolution.model_refs roster, see
  #       vram.py `_build_model_defaults`).  A model loaded by another tool
  #       (llama.cpp, LM Studio, an unrelated Ollama pull) is LEFT ALONE.
  #
  # WARNING for anyone setting `false`: the admission control still measures
  # against `defined.<active>.total_vram_gb`, so a foreign resident model eats
  # the budget CoE needs.  Leave at least 16 GB of VRAM free for CoE-coder, or
  # the first request will fail loudly rather than silently degrade.
  #
  # [FLAGGED FALSE as of 2026-09-21] The following sentence was written here
  # and is superseded.  Quoted VERBATIM so the correction is auditable:
  #
  #     # (vram.py
  #     # raises when a resident model exceeds `usable_gb`, and `_footprint()` raises
  #     # rather than guessing an undeclared model's size).
  #
  # The FIRST clause is accurate and is retained above.  The SECOND clause was
  # false: `_footprint()` does NOT raise on an undeclared model -- it GUESSES
  # via `_extract_param_billions(id) * 0.8` whenever the id contains an "<n>b"
  # pattern, and only raises when it cannot parse one at all.  Before the
  # 2026-09-21 footprint-table correction, all 13 live local models fell
  # through to that guess, so the intended loud safety net effectively never
  # fired.  CORRECTED STATEMENT (2026-09-21): the admission control's loud
  # failure is `vram.py` raising when a RESIDENT model's measured
  # `size_vram_gb` exceeds `usable_gb`; `_footprint()`'s raise is the narrow
  # backstop for an id with no `<n>b` substring, not the general case.  The
  # footprint table has since been re-baselined so every live model is
  # declared and the guess is not reached in normal operation.
  evict_on_boot: true
  defined:
    compact:
      total_vram_gb: 16
      os_reserved_gb: 0.2
      max_resident_local_models: 1
      default_num_ctx: 32768
      max_num_ctx: 32768
      default_keep_alive: 300
      # Black-box deadline for one prepare() cycle (evict + load +
      # re-probe, up to 3 attempts).  Exceeding it raises
      # PrepareTimeout, classified as a pathology (reroll with fresh
      # seed, escalate after budget exhaustion) instead of parking
      # the request until the server's 210s client-facing SSE idle
      # watchdog fires (cloud tiers exempt).  Healthy loads are
      # <=25s on this card; 120s covers the worst legitimate cycle
      # (evict + cold load + shrink-reload, ~55s) with ~2x margin.
      # Set very high (999999) to effectively disable the deadline.
      prepare_deadline_s: 120
  # --- Declared model WEIGHT footprints (GB, bytes/1e9 of the model blob) ---
  # DATE-STAMPED 2026-09-21 (step 4 of the config/VRAM-hygiene plan).
  #
  # This table is the SUBTRAHEND in the KV estimate:
  #     estimated_kv_gb = size_vram_gb - declared_weight_gb
  # so it holds the WEIGHTS ONLY.  It is NOT a weights+KV budget; KV is
  # accounted separately and bounded live via `max_num_ctx` and the
  # post-load `size_vram_gb > usable_gb` check.  See vram.py module
  # docstring ("size_vram which includes the model weight and the KV
  # cache") and prepare()'s log line "(kv=..GB total=..GB budget=..GB)".
  #
  # Values are MEASURED from each model's blob (the layer whose mediaType
  # is `application/vnd.ollama.image.model`, which IS the GGUF):
  #     19B-A3B q4_K_M : 13190417664 B = 13.190 GB -> 13.19
  #     14B-A4B q4_K_M : 10400852256 B = 10.401 GB -> 10.40
  #     gemma4:12b     :  7381382048 B =  7.381 GB ->  7.38  (model layer
  #                      only; the separate 0.175 GB `projector` blob -- its
  #                      vision tower -- is deliberately NOT counted here,
  #                      because this table models the WEIGHT term and the
  #                      projector is not loaded for text requests)
  #     qwen3.5:4b     :  3389971840 B =  3.390 GB ->  3.39
  #
  # KEYS ARE WRITTEN BARE.  The runtime resolves the bare id (from
  # `model_refs`), and vram.py's `_footprint_lookup` now also tolerates a
  # trailing ":latest" on EITHER side, so a registry/tag mismatch cannot
  # miss.  Writing bare makes the table and the runtime agree in spelling.
  #
  # LOCAL ONLY.  There is deliberately NO cloud entry: cloud models never
  # reach prepare() and are configured separately (user ruling 2026-09-21,
  # "no cloud in local matters").  A cloud id reaching the local admission
  # path should RAISE rather than be silently admitted.
  #
  # A model NOT listed here falls back to `_extract_param_billions(id)*0.8`
  # (a regex guess), which is why every live model must be declared.
  model_footprints_gb:
    # --- router + generalist (general-purpose, not specialist models) ---
    "qwen3.5:4b": 3.39
    # generalist (models.general_fallback): model layer 7.381 GB (see table note above)
    "gemma4:12b": 7.38
    # --- python domain (python-a primary, python-b think-on / tiel, python-c bug_fix) ---
    "JThomas-CoE/coe-qwen3.6-hc-coding_python-r25-19b-a3b-q4_k_m": 13.19
    "CoE-Tiel-Coder-python-n1-55-19b-a3b-q4_k_xl": 13.39
    "JThomas-CoE/coe-gemma4-python-hc-14b-a4b-q4_k_m": 10.40
    # --- web domain ---
    "JThomas-CoE/coe-qwen3.6-hc-coding_web-r25-19b-a3b-q4_k_m": 13.19
    "JThomas-CoE/coe-gemma4-web-hc-14b-a4b-q4_k_m": 10.40
    # --- compiled domain (single tag fills both roles) ---
    "JThomas-CoE/coe-gemma4-coding-hc-14b-a4b-q4_k_m": 10.40
    # --- math domain ---
    "JThomas-CoE/coe-gemma4-math-hc-14b-a4b-q4_k_m": 10.40
    "JThomas-CoE/coe-qwen3.6-mmlu_pro-math-r31-19b-a3b-q4_k_m": 13.19
    # --- physics domain ---
    "JThomas-CoE/coe-qwen3.6-mmlu_pro-physics-r31-19b-a3b-q4_k_m": 13.19
    "JThomas-CoE/coe-gemma4-physics-mmlu_pro-14b-a4b-q4": 10.40

clean_resolution:
  # Domain confidence floor (user ruling 2026-09-04): a domain below this
  # confidence falls to domain_other. Wired into the router post-probe
  # merge (previously loaded but never consumed).
  min_domain_confidence: 0.80
  # Router probe policy (user ruling 2026-09-04): per-field scoping.
  #   lock_threshold    : confidence >= this => field locked, probe never changes it
  #   band_low          : fields below this are NOT probe-eligible; they fall
  #                       to defaults (domain_other / general_use / SDST)
  #   override_min_gain : a probe-eligible field changes only if the re-eval's
  #                       confidence >= original + gain
  #   trivial_threshold : trivial=true iff trivial_confidence > this; trivial is
  #                       NEVER probe-eligible
  router_probe:
    lock_threshold: 0.80
    band_low: 0.65
    override_min_gain: 0.05
    trivial_threshold: 0.80
  closed_think_default: true
  # domain_aliases removed — the router emits domain_<name> directly;
  # the matrix looks up by domain_<name>. No alias mapping needed.

  # Persona registry.  Each domain row's `persona:` is a KEY into this
  # dict.  The persona is injected into the harness system prompt as the
  # model's role.  Personas reflect an actual ROLE (e.g. "python_coder",
  # "mathematics_assistant"), not a bare topic.
  #
  # === HOW TO REGISTER A NEW DOMAIN ===
  # Adding a domain requires ALL of the following, or the matrix will not
  # route to it correctly:
  #   1. A `domain_rows.<domain_name>` entry with:
  #        persona:        the persona KEY (must exist in `personas:` below)
  #        primary_model_ref / secondary_model_ref: model refs (see the
  #                        `models:` block) for the specialist slots
  #        task_harnesses: which canonical harnesses the domain exposes.
  #                        Coding domains (python/web/compiled): all 5
  #                        (new_code_generation, bug_fix, modify_artifact,
  #                        evaluate_artifact, general_use).  Non-coding
  #                        domains: modify_artifact, evaluate_artifact,
  #                        general_use.
  #        description:    one-line anchor of what the domain represents,
  #                        injected into the router system prompt so the
  #                        classifier can ground its choice.
  #        include_topics: keywords that SHOULD nudge routing to this
  #                        domain (steering, not a hard gate).
  #        exclude_topics: keywords that SHOULD nudge routing AWAY from
  #                        this domain (steering, not a hard gate).
  #   2. A matching `personas.<persona_key>` role text.
  #   3. Any new model_refs used above must exist in `models:`.
  # The router's closed-domain list and the matrix are BOTH derived from
  # `domain_rows` keys, so a new domain automatically appears in the
  # router's allowed-domain list once the row is added.
  personas:
    general_assistant: "You are a general assistant. Answer directly and accurately."
    python_coder: "You are a Python programming assistant. Your priorities, in order: correct behavior including edge cases such as empty and boundary inputs; following the names, signatures and behavior the request specifies; clear, idiomatic code."
    web_coder: "You are a web coding assistant. Provide complete, production-ready frontend/browser solutions."
    compiled_coder: "You are a compiled-language coding assistant. Provide correct, idiomatic C/C++/Rust/Go/Java solutions."
    mathematics_assistant: "You are a mathematics assistant. Provide rigorous derivations and clear step-by-step reasoning."
    physics_assistant: "You are a physics assistant. Provide clear derivations and standard notation."

  # === TAG REGISTRY ===
  # The matrix (domain_rows) names TAGS only (model:python-a).  Each tag
  # here maps to the real model the backend runs.  The tag name is the
  # model call name the backend uses (register the real model in Ollama
  # under the tag name via `ollama cp <hf-repo> <tag>`).
  #
  # Default binding: -a = primary, -b = secondary (free-form; the user may
  # assign any tag to any role).  python-c is gemma4-python, used as the
  # bug_fix primary.  Each tag declares a bounded num_ctx so the VRAM
  # manager can always force a smaller context, even after Ollama's 262k
  # default would otherwise be locked in for a resident model.
  model_refs:
    # Inline model_id values use the PUBLIC HF release names
    # (JThomas-CoE/<repo>).  THIS file is now the SOLE binding layer for
    # tag -> model: config.py in this tree reads config.yaml and nothing
    # else.  To re-point a tag at a different local root, edit the
    # `model_id` below.
    #
    # [FLAGGED FALSE as of 2026-09-22]  The following sentence stood here
    # and is superseded.  Quoted VERBATIM so the correction is auditable:
    #
    #     model_assignment.yaml remains the binding layer: it maps each tag
    #     to the model the local backend actually calls, so a user whose
    #     local roots differ can rebind without touching the matrix.  When
    #     the two agree, the merge is a no-op.
    #
    # CORRECTED STATEMENT (2026-09-22).  `model_assignment.yaml` has been
    # DELETED from this tree on user ruling (it was an unused analog of
    # this block).  Evidence: the deleted file's 10 `tags[].model` values
    # were byte-identical to the `model_id` values below, and its
    # `router`/`generalist` blocks (`qwen3.5:4b`, `gemma4:12b`) duplicated
    # `models.router`, `models.router_fallback` and
    # `models.general_fallback`.  Its `backend` key was null, so the
    # merge's backend injection was also a no-op ({'type': 'ollama'}
    # either way).  Nothing is lost by the deletion.
    #
    # The claim "When the two agree, the merge is a no-op" was true only
    # of a tree whose inline ids are current.  Do NOT generalise it: in
    # `CoE-coder-16GB-release\CoE_coder_16GB` the inline ids are still
    # stale (`coe-svdv2-*`, `jthomas/*`), so there the merge is
    # LOAD-BEARING and that tree's assignment file must not be deleted.
    # That tree is superseded by the relocatable build and is not the
    # shipped artifact.
    # [renamed 2026-09-22] The tree was renamed to
    # `CoE-coder-16GB-release-SUPERSEDED` so it can no longer be mistaken for the
    # release payload, and it is EXCLUDED from the build. The payload is built from
    # the dev tree (`CoE_agent/CoE_coder_16GB`).
    #
    # Checkpoint: CoE_agent/_checkpoints/model_assignment_delete_pre_20260922_115623
    # --- python ---
    python-a: { model_id: "JThomas-CoE/coe-qwen3.6-hc-coding_python-r25-19b-a3b-q4_k_m", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: true, vision: true }
    python-b: { model_id: "CoE-Tiel-Coder-python-n1-55-19b-a3b-q4_k_xl", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: true, raw_prefill: true, vision: true }
    python-c: { model_id: "JThomas-CoE/coe-gemma4-python-hc-14b-a4b-q4_k_m", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: false, vision: true }
    # --- web ---
    web-a: { model_id: "JThomas-CoE/coe-qwen3.6-hc-coding_web-r25-19b-a3b-q4_k_m", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: true, vision: true }
    web-b: { model_id: "JThomas-CoE/coe-gemma4-web-hc-14b-a4b-q4_k_m", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: false, vision: true }
    # --- compiled (no qwen3.6 compiled model exists; one tag, used for both roles) ---
    compiled-a: { model_id: "JThomas-CoE/coe-gemma4-coding-hc-14b-a4b-q4_k_m", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: false, vision: true }
    # --- math ---
    math-a: { model_id: "JThomas-CoE/coe-gemma4-math-hc-14b-a4b-q4_k_m", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: false, vision: true }
    math-b: { model_id: "JThomas-CoE/coe-qwen3.6-mmlu_pro-math-r31-19b-a3b-q4_k_m", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: true, vision: true }
    # --- physics ---
    physics-a: { model_id: "JThomas-CoE/coe-qwen3.6-mmlu_pro-physics-r31-19b-a3b-q4_k_m", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: true, vision: true }
    physics-b: { model_id: "JThomas-CoE/coe-gemma4-physics-mmlu_pro-14b-a4b-q4", provider: ollama, num_ctx: 32768, num_predict: 24576, keep_alive: 300, think: false, raw_prefill: false, vision: true }
    # --- cloud T3 targets (informational) ---
    # The T3 cloud target is NOT selected from these refs.  The live
    # contract is backends.cloud: model_id for text-only requests,
    # vision_model_id for image-bearing requests (attachment-conditional
    # selection; there are no cloud primary/secondary roles).  Kept as a
    # reference mirror of the backends.cloud values.
    cloud_text: { model_id: "deepseek-v4.1-flash:cloud", provider: cloud }
    cloud_vision: { model_id: "deepseek-v4.1-flash:cloud", provider: cloud }
    # --- not yet wired to a domain (kept for reference) ---

  domain_rows:
    domain_python:
      persona: python_coder
      description: "Python development: scripting, functions/classes, async, web frameworks (FastAPI/Flask/Django), data processing, testing, tooling."
      include_topics: [python, script, function, class, async, asyncio, fastapi, flask, django, pytest, pandas, numpy, decorator, dataclass]
      exclude_topics: [c++, rust, go, java, javascript, typescript, html, css, sql, docker, kubernetes]
      primary_model_ref: model:python-b
      secondary_model_ref: model:python-a
      task_harnesses: { new_code_generation: new_code_generation, bug_fix: bug_fix, modify_artifact: modify_harness, evaluate_artifact: evaluate_artifact, general_use: general_use }
      task_cells:
        # Think-state-dependent role ordering.  The request's effective think
        # state selects the branch; default (think-off) = qwen primary / ornith
        # secondary.  /thinkon promotes ornith to primary.  Never changes how a
        # model behaves -- think mode is fixed by each model's default.
        new_code_generation:
          think_off: { primary_model_ref: model:python-a, secondary_model_ref: model:python-b }
          think_on:  { primary_model_ref: model:python-b, secondary_model_ref: model:python-a }
        # bug_fix primary is python-c (gemma4-python), NOT python-a.  This
        # demonstrates the free-form tag binding: any tag may fill any role.
        # Secondary is python-b (ornith n1-55).
        bug_fix: { primary_model_ref: model:python-c, secondary_model_ref: model:python-b }
    domain_compiled:
      persona: compiled_coder
      description: "Compiled systems languages: C, C++, Rust, Go, Java, Kotlin, Scala — systems, algorithms, data structures, performance."
      include_topics: [c, cpp, c++, rust, go, java, kotlin, scala, pointer, memory, algorithm, data structure, systems, concurrency]
      exclude_topics: [python, javascript, html, css, react, sql]
      # No qwen3.6 compiled model exists; the single compiled-a tag fills
      # BOTH primary and secondary roles.  The harness is slot-agnostic, so
      # primary == secondary is valid (secondary re-runs the same model).
      primary_model_ref: model:compiled-a
      secondary_model_ref: model:compiled-a
      task_harnesses: { new_code_generation: new_code_generation, bug_fix: bug_fix, modify_artifact: modify_harness, evaluate_artifact: evaluate_artifact, general_use: general_use }
      task_cells:
        new_code_generation: { primary_model_ref: model:compiled-a, secondary_model_ref: model:compiled-a }
        bug_fix: { primary_model_ref: model:compiled-a, secondary_model_ref: model:compiled-a }
    domain_web:
      persona: web_coder
      description: "Frontend and browser development: HTML, CSS, JavaScript/TypeScript, React/Vue, responsive design, accessibility, DOM."
      include_topics: [html, css, javascript, typescript, jsx, tsx, react, vue, svelte, nodejs, frontend, responsive, accessibility, dom, tailwind]
      exclude_topics: [python, c++, rust, go, java, database schema, backend api, ml engineering]
      primary_model_ref: model:web-a
      secondary_model_ref: model:web-b
      task_harnesses: { new_code_generation: new_code_generation, bug_fix: bug_fix, modify_artifact: modify_harness, evaluate_artifact: evaluate_artifact, general_use: general_use }
      task_cells:
        new_code_generation:
          primary_model_ref: model:web-a
          secondary_model_ref: model:web-b
          assistant_prefill: null
        bug_fix: { primary_model_ref: model:web-a, secondary_model_ref: model:web-b }
        modify_artifact: { primary_model_ref: model:web-a, secondary_model_ref: model:web-b }
        evaluate_artifact: { primary_model_ref: model:web-a, secondary_model_ref: model:web-b }
    domain_math:
      persona: mathematics_assistant
      description: "Mathematics: arithmetic, algebra, geometry, trig, calculus, probability/statistics, number theory, proofs, word problems."
      include_topics: [arithmetic, algebra, factoring, equation, inequality, geometry, trig, calculus, derivative, integral, probability, statistics, combinatorics, number theory, sequence, series, proof, word problem]
      exclude_topics: [python, c++, rust, go, java, web, html, sql, medical diagnosis, legal]
      primary_model_ref: model:math-a
      secondary_model_ref: model:math-b
      task_harnesses: { general_use: general_use }
    domain_physics:
      persona: physics_assistant
      description: "Physics: mechanics, electromagnetism, thermodynamics, waves, optics, relativity, quantum — equations and physical reasoning."
      include_topics: [force, motion, momentum, energy, work, electricity, magnetism, circuit, thermodynamics, heat, wave, optics, light, relativity, quantum, kinematic, newton]
      exclude_topics: [python, c++, rust, go, java, html, sql, medical diagnosis, legal]
      primary_model_ref: model:physics-a
      secondary_model_ref: model:physics-b
      task_harnesses: { general_use: general_use }
    # domain_other is the generalist catch-all.  Requests routed here
    # (explicitly, or because the router emitted a domain that is not
    # in this matrix) run on the generalist model.  It is NOT
    # restricted to the general_use harness: artifact-aware task types
    # use their real canonical harnesses (modify_artifact /
    # evaluate_artifact), driven by the generalist model.  Only
    # code-generation task types (new_code_generation / bug_fix) map
    # to general_use, because the generalist has no coding-specialist
    # harness here.  When a new coding domain (python/compiled/web)
    # is added it should expose all 5 canonical harnesses; a new
    # non-coding domain should expose modify_artifact,
    # evaluate_artifact, and general_use.
    domain_other:
      persona: general_assistant
      description: "General-purpose and catch-all domain for requests not covered by the specialist domains — general reasoning, planning, synthesis, question answering."
      include_topics: [general, reasoning, planning, synthesis, explain, summarize, question, research]
      exclude_topics: [python, web, compiled, math, physics]
      primary_model_ref: generalist
      secondary_model_ref: generalist
      task_harnesses: { general_use: general_use, new_code_generation: general_use, bug_fix: general_use, modify_artifact: modify_harness, evaluate_artifact: evaluate_artifact }
      task_cells: {}

  # The 3 rejection templates for non-SDST task scopes.  These are
  # server-side responses, NOT harnesses.  They are routed to by
  # the matrix's resolve() path BEFORE the matrix is consulted.
  rejection_messages:
    single_domain_multi_task:
      code: task_scope_rejected_sdmt
      severity: error
      message: |
        The router determined your request is single-domain-multi-task
        (SDMT). This scope is not currently supported. Please decompose
        your request into N independent single-domain-single-task units
        of work, where each unit targets exactly one domain and one task
        type. Submit each unit as a separate request.
    multi_domain_single_task:
      code: task_scope_rejected_mdst
      severity: error
      message: |
        The router determined your request is multi-domain-single-task
        (MDST). This scope is not currently supported. Please decompose
        your request into N independent single-domain-single-task units
        of work, where each unit targets exactly one domain and one task
        type. Submit each unit as a separate request.
    multi_domain_multi_task:
      code: task_scope_rejected_mdmt
      severity: error
      message: |
        The router determined your request is multi-domain-multi-task
        (MDMT). This scope is not currently supported. Please decompose
        your request into N independent single-domain-single-task units
        of work, where each unit targets exactly one domain and one task
        type. Submit each unit as a separate request.

  harnesses:
      # ── The 5 canonical harnesses ──
      # Each harness is the protocol for one task type. Defined once,
      # shared across all domains that use it. Per-cell runtime_overrides
      # tune the harness's surfaced parameters for each (domain, task_type) node.
      #
      # Voice convention:
      #   system_suffix = second person (system → model)
      #   assistant_prefill = first person (model's own voice)
      #   re_roll_modifiers = second person (system → model)
      #   JSON prefills = structural (no voice)
      #
      # Placeholder convention:
      #   {{domain_tag}} = domain name with "domain_" stripped (e.g., "python", "physics")
      #   {{fence_language}} = actual fence language from T0's code block (runtime-detected)
      #   {{domain_tag}} is NOT used in general_use (generic fallback).
    
      general_use:
        family: general_use
        tiers: [T0]
        closed_think: false
        assistant_prefill: null
        sampling: { temperature: 0.6, top_k: -1, top_p: 1.0, repeat_penalty: 1.05, repeat_last_n: 1024, num_ctx: 32768, num_predict: 24576 }
        escalation_ladder:
          t0:
            model_slot: primary
            seed_policy: fresh
            functional_budget: 0
            user_modifier: null
            artifact_contract: null
            functional_errors: []
          # 2026-09-13 (user ruling): the old `pathology_budget` block was
          # REMOVED here.  No code read it: the runtime resolves the
          # pathology budget from `runtime.pathology` ONLY.  It duplicated
          # max_re_rolls_per_model / re_roll_seed_strategy / errors and also
          # carried restart_policy, functional_count_reset and
          # pathology_count_reset, which no code reads at all -- so editing
          # it changed nothing and it had already drifted out of sync.  The
          # behaviour those keys described is now implemented in code (the
          # per-slot budget reset in the tier loop, fresh-seed rerolls).
          meta_harness_ladder: null
        runtime:
          primitives: [dither_guard, repetition_loop_guard]
          dither_pattern: "(?i)\\b(?:wait|actually|hmm|sorry|instead|reconsider(?:ing|s|ed)?|re-?examin(?:e|ing|ed)|but\\s+wait|on\\s+(?:second\\s+)?thought|let\\s+me\\s+(?:re-?think|re-?do|try\\s+again|reconsider))\\b"
          dither_limit: 35
          loop_guard_min: 1400
          loop_guard_skip: 1400
          loop_guard_match: 100
          # 2026-09-10 (user ruling): window raised 400 -> 1000 code-base-wide.
          # The 2026-09-10 capture showed a T2 diff-hunk loop with a 351-char
          # period that the 400-char window missed by 51 chars (the guard's
          # proximity lookahead is window - match).  1000 covers the observed
          # short-period class with margin; the >=3-count gate retains the
          # 2026-09-07 asc/desc false-positive protection.
          loop_guard_window: 1000
          retry_new_seed: true
          pathology:
            max_re_rolls_per_model: 2
            re_roll_seed_strategy: random_per_model
            errors: [dither, loop, first_token_timeout, slow_decode_timeout, vram_breach, token_exhaustion, backend_error, empty_response]
          stream_primitives:
            fence_counter:
              check_cadence_chunks: -1
            dither_check:
              check_cadence_chunks: 25
            loop_check:
              check_cadence_chunks: 25
          timers:
            first_token_timeout_s: 60.0
            slow_decode_timeout_s: 90.0
            cold_load_first_token_timeout_s: 75.0
            pathology_safety_factor: 2.5
          re_roll_modifiers:
            dither: "Your previous response contained excess dithering. On this attempt: be concise, commit to your answer, and do not second-guess yourself. Reach your final answer and stop."
            loop: "Your previous response contained a repetition loop. On this attempt: be concise and do not repeat the same phrases. Reach your final answer and stop."
          max_calls_per_instance: 12
        parameter_ranges:
          sampling.temperature: [0.0, 2.0]
          sampling.num_predict: [512, 32768]
          pathology.max_re_rolls_per_model: [0, 10]
          dither_limit: [1, 100]
          loop_guard_min: [100, 5000]
          loop_guard_skip: [100, 5000]
          loop_guard_match: [10, 500]
          loop_guard_window: [50, 2000]
          max_calls_per_instance: [1, 50]
          timers.first_token_timeout_s: [10.0, 300.0]
          timers.slow_decode_timeout_s: [10.0, 600.0]
          timers.cold_load_first_token_timeout_s: [10.0, 600.0]
        system_suffix: "You are a helpful and competent assistant. Answer the user's prompt with accuracy and concision."
    
      new_code_generation:
        family: new_code_generation
        tiers: [T0, T1a, T1b, T2]
        closed_think: true
        assistant_prefill: |-
          I need to work through this task carefully and be concise. I may use a draft code block to reason inline with comments, but my answer will be a complete, closed final code block, and then I will stop.

          I will now start by creating an opening code block fence for the coding language called for by the user request.

          ```
        sampling: { temperature: 0.6, top_k: -1, top_p: 1.0, repeat_penalty: 1.05, repeat_last_n: 1024, num_ctx: 32768, num_predict: 24576, seed: 42 }
        escalation_ladder:
          t0:
            model_slot: primary
            seed_policy: fresh
            functional_budget: 1
            user_modifier: null
            artifact_contract: new_code_generation
            functional_errors: [syntax_error, no_code_fence, incomplete_fence]
          t1a:
            model_slot: primary
            seed_policy: same_as_t0
            functional_budget: 1
            user_modifier: |
              The previous code block failed functional validation with this error:
              {t0_error}
    
              Here is the previous code block:
    
              ```{{fence_language}}
              {t0_code}
              ```
    
              Produce a unified diff that fixes the error. Wrap the diff in
              a <patch>...</patch> block. Do not regenerate the entire code
              block — emit only the smallest possible change that fixes the error.
            artifact_contract: unified_diff_patch
            functional_errors: [empty_patch, malformed_patch, multiple_patches, patch_empty_diff, patch_does_not_apply]
            apply_policy:
              apply_target: t0_code
              apply_mechanism: modify_artifact_deterministic_reintegration
          t1b:
            model_slot: primary
            seed_policy: same_as_t0
            functional_budget: 1
            user_modifier: |
              The model's generated code has the following error trace:
              {prior_error}
    
              Regenerate the code without the error.
            artifact_contract: new_code_generation
            functional_errors: [syntax_error, no_code_fence, incomplete_fence]
          t2:
            model_slot: secondary
            seed_policy: fresh
            functional_budget: 1
            user_modifier: null
            artifact_contract: new_code_generation
            functional_errors: [syntax_error, no_code_fence, incomplete_fence]
            nested_ladder:
              t1a:
                model_slot: secondary
                seed_policy: same_as_t0_t2
                functional_budget: 1
                user_modifier: |
                  The previous code block failed functional validation with this error:
                  {t0_error}
    
                  Here is the previous code block:
    
                  ```{{fence_language}}
                  {t0_code}
                  ```
    
                  Produce a unified diff that fixes the error. Wrap the diff in
                  a <patch>...</patch> block. Do not regenerate the entire code
                  block — emit only the smallest possible change that fixes the error.
                artifact_contract: unified_diff_patch
                functional_errors: [empty_patch, malformed_patch, multiple_patches, patch_empty_diff, patch_does_not_apply]
                apply_policy:
                  apply_target: t0_code
                  apply_mechanism: modify_artifact_deterministic_reintegration
              t1b:
                model_slot: secondary
                seed_policy: same_as_t0_t2
                functional_budget: 1
                user_modifier: |
                  The model's generated code has the following error trace:
                  {prior_error}
    
                  Regenerate the code without the error.
                artifact_contract: new_code_generation
                functional_errors: [syntax_error, no_code_fence, incomplete_fence]
          meta_harness_ladder:
            # T3 cloud first (pennies, ~1-3 min, SOTA quality for the
            # hard core local cannot converge on), T5 local generalist
            # as the free last resort.  cloud_sota silently skips when
            # backends.cloud is disabled (released default).
            targets: [cloud_sota, generalist_zero_shot]
            # D2/D3/D4 (2026-08-29): cloud escalation policy.
            # on_failure: hard_stop = a failed T3 ENDS the request; no
            #   T5 fallthrough (local generalist after cloud failure is
            #   a wasted multi-minute attempt).
            # silence_timeout_s: in-attempt dead-air limit.  A cloud
            #   stream silent this long is recorded as a failed attempt
            #   (cloud_silence_timeout) instead of being cancelled by
            #   the outer SSE watchdog.
            #
            #   2026-09-19 (PLAN_progress_mechanism.md phase 11): 600 -> 240.
            #   The old rationale was "cloud may queue/cold-start far longer
            #   than a local model, so this sits well above the local 330s
            #   watchdog".  That reasoning no longer holds: the SSE watchdog
            #   now EXEMPTS cloud tiers entirely (server.py), so cloud silence
            #   is owned by THIS key and by total_timeout_s alone and no longer
            #   needs to out-rank a local watchdog.
            #
            #   240s is a deliberate FAILURE threshold, not a reporting
            #   cadence: it must stay above the longest LEGITIMATE stream gap,
            #   and `reasoning_effort: high` means multi-minute reasoning
            #   pauses are real.  Progress VISIBILITY is the separate 30s
            #   cadence (progress_interval_s); do NOT lower this key to 30 to
            #   try to get faster updates -- that would kill healthy calls.
            #
            #   Safe to lower without touching the output budget: max_tokens is
            #   set EXPLICITLY below, which overrides the
            #   tokens_per_sec * total_timeout_s derivation.  total_timeout_s
            #   is unchanged at 600.
            #
            #   null = no dead-air limit.
            # total_timeout_s: hard wall-clock cap for the WHOLE cloud
            #   attempt (not just a silent gap).  Guards against a
            #   runaway cloud request burning unbounded wall time.
            #   null = unlimited.
            # think: cloud reasoning-depth hint sent as reasoning_effort.
            #   null = provider default; bool true/false; or a string
            #   low/medium/high.
            # max_tokens: explicit cloud output contract, DERIVED as
            #   tokens_per_sec * total_timeout_s (so the cloud gets
            #   exactly as many tokens as it can produce within its wall
            #   budget at a configured rate).  null = provider default.
            #   Explicit int override wins if set.
            # tokens_per_sec: assumed cloud decode rate used to derive
            #   max_tokens when max_tokens is not explicitly set.
            # cloud_guards (2026-08-30): CLOUD-SPECIFIC dither/loop guard
            #   tunings, DISTINCT from the local pruned-model thresholds.
            #   Cloud serving hard problems may dither/loop differently
            #   than a pruned local MoE, so these are separate keys.
            cloud:
              on_failure: hard_stop
              silence_timeout_s: 240
              total_timeout_s: 600
              # 2026-09-09 (user ruling): cloud reasoning effort is a
              # SEPARATE parameter from the local think on/off policy.
              # Values: "low" | "medium" | "high" (OpenAI-style
              # reasoning_effort). The local think flag NEVER maps onto
              # this. low-effort was implicated in prose-preamble leakage
              # on the 2026-09-09 T3 modify call; "high" keeps reasoning
              # in the model's thinking span so the answer channel stays
              # clean JSON.
              reasoning_effort: "high"
              # 2026-08-31: max_tokens=50000 default (validated).  The
              # reasoning channel eats budget; 50k leaves room for content.
              max_tokens: 50000
              tokens_per_sec: 150
              # 2026-08-31: per-harness cloud prompts.  The cloud path is
              # harness-aware: it selects the prompt by work.harness.harness_id.
              # Each is the validated concise contract for that harness.
              prompts:
                new_code_generation:
                  system_suffix: "You are an expert programmer. Solve the coding request in the language it specifies, in a straightforward and concise manner. Avoid verbose and convoluted reasoning and/or explanations. A working solution is preferable to lengthy attempts to find the best or most optimized solution. Emit a single, properly fenced code block in that language and stop without further prose explanations or second guessing."
                  output_instruction: "Respond with a single fenced code block in the language the request specifies, and nothing else."
                bug_fix:
                  system_suffix: "You are an expert python software engineer. You are given a GitHub issue and the relevant code slice from the repository. Produce a unified-diff patch that resolves the issue.\n\nEmit EXACTLY ONE <patch>...</patch> block containing a complete, well-formed unified diff. The patch MUST begin with `diff --git a/<path> b/<path>`, then `--- a/<path>` and `+++ b/<path>`, then at least one hunk header `@@ -<start>,<count> +<start>,<count> @@` using the ACTUAL line numbers from the provided code slice.\n\nBe concise. Do not reason at length. Emit the <patch> block and stop immediately after </patch>."
                  output_instruction: "Return exactly one <patch>...</patch> block with a complete unified diff."
                # 2026-09-18 (user ruling): the `modify_harness_legacy` entry that used to
                # sit here was DELETED.  It was a stale duplicate: it still promised a
                # "BM25 section index" and an "R2 JSON edit package", both superseded, and
                # it could never be read anyway -- a modify request resolves its OWN
                # harness, whose `cloud.prompts.<harness_id>` entry is what the runtime
                # actually loads (`_prompts.get(_harness_id)`).  Nothing referenced it.

                evaluate_artifact:
                  system_suffix: "You are an artifact analysis assistant. The artifact content, structure, and section index are provided separately. Follow the user's request exactly. The user's requested answer target takes priority over the word \"evaluate\". Answer navigation and data-flow questions directly. Use section names and concise code references. Be concise, do not reason at length."
                  output_instruction: "Answer the user's question about the artifact directly and concisely."
              cloud_guards:
                dither_enabled: true
                # SHORTSTOP rule: evaluate the trailing shortstop_window chars of the
                # cloud stream once its length exceeds shortstop_min_chars; if the
                # dither-marker DENSITY in that window exceeds shortstop_rate, cut the
                # request (it is dithering without committing).  Units are markers per
                # CHAR of the trailing window -- NOT per 10k (2026-09-18 correction).
                #
                # 2026-09-18 (user ruling): 2.0 -> 100.0, and the redundant `* 1000`
                # divisor in runtime.py removed so the unit is honest.
                #   * 2.0 was calibrated against glm-5.3-flash on 20 held-out hard
                #     qids (T=2.0, P=30000 -> 100% precision, 67% recall, 0 passing
                #     qids cut).
                #   * The shipped cloud model is now deepseek-v4.1-flash:cloud, whose
                #     reasoning trace uses the dither markers as ordinary analytic
                #     connectives, so a legitimate 44,423-char change-order attempt was
                #     cut at 2.34.
                #   * 100.0 makes the rule effectively NON-TRIPPING.  This is a
                #     temporary DATA-GATHERING default, NOT a recalibration.
                # RESET: README.md -> "Cloud dither guard recalibration".  All five
                # cloud-bearing harnesses carry the same value deliberately.
                shortstop_enabled: true
                shortstop_rate: 100.0
                shortstop_min_chars: 30000
                shortstop_window: 10000
                # 2026-08-30: HIGH dither limit so the guard does NOT
                # truncate the cloud stream before its full bimodal time
                # evolution develops (local bimodal data showed the danger
                # is a LATE dense-spike, not an early count).  Runaway
                # protection is instead handled by the time/token caps:
                #   total_timeout_s = hard wall-clock stop
                #   max_tokens (derived = tokens_per_sec * total_timeout_s)
                # A limit this high effectively never trips on dither; the
                # dither COUNT is still logged per T3 for density analysis.
                dither_limit: 10000
                dither_limit_think_scale: 3
                dither_pattern: "(?i)\\b(?:wait|actually|hmm|sorry|instead|reconsider(?:ing|s|ed)?|re-?examin(?:e|ing|ed)|but\\s+wait|on\\s+(?:second\\s+)?thought|let\\s+me\\s+(?:re-?think|re-?do|try\\s+again|reconsider))\\b"
                loop_enabled: false
                loop_guard_min: 2000
                loop_guard_skip: 2000
                loop_guard_match: 100
                # 2026-09-10 (user ruling): window 400 -> 1000 code-base-wide.
                loop_guard_window: 1000
          # 2026-09-13 (user ruling): dead `pathology_budget` block REMOVED
          # (no code reads it; `runtime.pathology` is the live source).
        runtime:
          primitives: [dither_guard, repetition_loop_guard]
          dither_pattern: "(?i)\\b(?:wait|actually|hmm|sorry|instead|reconsider(?:ing|s|ed)?|re-?examin(?:e|ing|ed)|but\\s+wait|on\\s+(?:second\\s+)?thought|let\\s+me\\s+(?:re-?think|re-?do|try\\s+again|reconsider))\\b"
          dither_limit: 35
          # Think-on slots (e.g. ornith secondary) legitimately emit
          # revision markers in their native reasoning trace.  Multiply
          # the dither limit by this scale when the slot is think-on so
          # the guard does not cut off a think-on model mid-reasoning.
          dither_limit_think_scale: 3
          loop_guard_min: 1400
          loop_guard_skip: 1400
          loop_guard_match: 100
          # 2026-09-10 (user ruling): window raised 400 -> 1000 code-base-wide.
          loop_guard_window: 1000
          # Rate-stall gate (StallMonitor, added 2026-08-27).  Catches
          # streams that go silent mid-attempt (rate_stall: zero output
          # for zero_k consecutive 60s windows) or grind down to <30%
          # of their own median active rate for partial_k consecutive
          # windows (rate_collapse).  Derived from the 14-stream
          # profiling run lcb_clean75_coe_20260827_152115: all 5
          # terminal runaways stall (240-330s of dead air); PASS
          # streams never go silent except transiently (80s max).
          # zero_k=2 spares the observed 80s recovery while catching
          # every runaway.  Set stall.enabled: 0 to disable.
          stall:
            enabled: 1
            window_s: 60
            arm_windows: 1
            arm_min_chars: 300
            zero_k: 2
            partial_ratio: 0.30
            partial_k: 4
            reset_ratio: 0.50
          artifact_contract: new_code_generation
          retry_new_seed: true
          # Output ceiling (2026-08-29): convergence-failure proxy.  When a
          # single attempt generates > max_chars (or the CUMULATIVE output
          # across all of this problem's attempts exceeds max_total_chars),
          # the attempt is classified output_ceiling_exceeded -- a pathology
          # (budgeted reroll / escalation).  Scope declaration of the black
          # box: single-domain/single-task subagent.  2026-08-29 tuning:
          # raised 20k/30k -> 75k/125k (75k covers deep-think VL answers;
          # 125k cumulative catches hard-problem grinders; the transport
          # -test calibration 20k/30k truncated productive think-on runs).
          # README TUNE FLAG: per-deployment values; list under "Local
          # tuning knobs" in the release README.
          output_ceiling:
            enabled: 1
            max_chars: 75000
            max_total_chars: 125000
            # 2026-08-30: held-out minimum char budget for the secondary
            # slot.  The primary's cumulative ceiling is effectively
            # (max_total_chars - min_secondary_chars) so the secondary
            # always gets >= this many chars when it escalates.  The
            # global max_total_chars stays a hard cap on the TOTAL.
            min_secondary_chars: 25000
          pathology:
            max_re_rolls_per_model: 2
            re_roll_seed_strategy: random_per_model
